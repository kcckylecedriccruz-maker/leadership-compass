name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
        env:
          # Public values only (the browser sees them anyway); no secrets are needed to build.
          VITE_SUPABASE_URL: https://ihjpihouoidogkvthhik.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-build-placeholder

  functions:
    name: Edge functions (Deno type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Type-check every function
        working-directory: supabase/functions
        run: deno check --node-modules-dir=none */index.ts
