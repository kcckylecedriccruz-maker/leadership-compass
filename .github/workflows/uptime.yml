name: Uptime check

# Basic monitoring: every 6 hours (and on demand) confirm the live site and the server functions answer.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Live site responds (Cloudflare, main)
        run: |
          curl -fsS --max-time 30 https://leadership-compass.leadership-compass.workers.dev/ | grep -q "Leadership Compass"
      - name: Backup site responds (Netlify)
        run: |
          curl -fsS --max-time 30 https://leadership-compass-formidea.netlify.app/ | grep -q "Leadership Compass"
      - name: Server functions respond
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X OPTIONS https://ihjpihouoidogkvthhik.supabase.co/functions/v1/ai-insights)
          echo "ai-insights answered $code"
          test "$code" = "200"
