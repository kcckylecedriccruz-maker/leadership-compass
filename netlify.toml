# Netlify hosting for Leadership Compass.
# The app is a static build (dist/); data, sign-in and email run on Supabase.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path serves index.html (Cloudflare does the same via wrangler.jsonc).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers live in public/_headers, which Netlify and Cloudflare Pages both read.
